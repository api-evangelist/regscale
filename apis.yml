  detail: >-
    RegScale publishes no OpenAPI, but STEP 0b did not come up empty: a first-party gRPC
    contract library (rs-data 1.5.0 on PyPI) yielded three real services and six RPCs, and the
    docs host serves a verbatim llms.txt. The one wall hit was the ReadMe docs host, which
    bot-challenges an ordinary crawler with HTTP 429 on HTML and on most .md paths, so the
    hosted API reference and the webhooks catalog could not be read.
