apis:
- aid: regscale-rest-api
  name: RegScale REST API
  description: 'The RegScale REST API is the primary programmable surface of the RegScale
    platform. It is served from each customer''s own RegScale tenant under the /api
    path, authenticated with a JSON Web Token obtained from /api/authentication/login
    or with a long-lived Personal Access Token issued to a Service Account. Resources
    follow a module/record model (security plans, controls, control implementations,
    assessments, issues, POA&Ms, assets, catalogues, profiles, components, workflows)
    and are related to one another through the ParentId + ParentModule convention.'
  humanURL: https://regscale.readme.io/reference/regscale-api-documentation
  baseURL: https://{your-instance}.regscale.com/api
  tags:
  - Compliance
  - Governance Risk and Compliance
  - Security
  - Audit
  properties:
  - type: Documentation
    url: https://regscale.readme.io/docs/overview
  - type: APIReference
    url: https://regscale.readme.io/reference/regscale-api-documentation
- aid: regscale-graphql-api
  name: RegScale GraphQL API
  description: 'RegScale exposes a GraphQL endpoint at /graphql on each customer tenant,
    used by the first-party RegScale CLI for high-volume paginated reads. Queries follow
    the HotChocolate connection shape - items, totalCount and pageInfo with take/skip
    paging and a where filter object - and are authenticated with the same Bearer token
    as the REST API.'
  humanURL: https://regscale.readme.io/docs/overview
  baseURL: https://{your-instance}.regscale.com/graphql
  tags:
  - GraphQL
  - Compliance
  - Security
- aid: regscale-grpc-ingestion
  name: RegScale gRPC Ingestion Services
  description: 'RegScale publishes a gRPC contract library, rs-data, covering three
    high-volume ingestion services: AssetIngestionService, IssueIngestionService and
    VulnIngestionService. Each service exposes a unary batch create-or-update RPC and
    a server-streaming variant for chunked ingestion, with Bearer-token call credentials
    over TLS.'
  humanURL: https://pypi.org/project/rs-data/
  baseURL: https://{your-instance}.regscale.com
  tags:
  - gRPC
  - Protobuf
  - Vulnerability Management
  properties:
  - type: Protobuf
    url: grpc/regscale-asset-service.proto
  - type: Protobuf
    url: grpc/regscale-issue-service.proto
  - type: Protobuf
    url: grpc/regscale-vuln-service.proto
