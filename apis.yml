aid: regscale
name: RegScale
description: 'RegScale is a Continuous Controls Monitoring (CCM) and compliance-automation
  company whose cloud-native, OSCAL-native GRC platform keeps organizations continuously
  audit-ready by turning compliance documentation into living, machine-readable data.
  The platform ships as a customer-tenanted deployment (SaaS, hybrid, or on-premises)
  and exposes its data through three programmable surfaces: a JWT-authenticated REST
  API under /api, a HotChocolate-style GraphQL endpoint at /graphql, and a published
  gRPC contract library (rs-data) covering asset, issue and vulnerability ingestion.
  RegScale also publishes a first-party Python CLI/SDK (regscale-cli) that doubles as
  an integration framework for 70+ scanners, cloud providers and ITSM tools, and holds
  FedRAMP High, SOC 2 Type 2, ISO 27001:2022, TX-RAMP Level 2 and CSA STAR credentials.'
url: https://raw.githubusercontent.com/api-evangelist/regscale/refs/heads/main/apis.yml
image: https://regscale.com/wp-content/uploads/2024/04/cropped-Regscale-Favicon-192x192.png
