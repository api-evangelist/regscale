group_count: 74
key_flows:
- name: bulk ingest scanner findings
  detail: 'each scanner group syncs assets, vulnerabilities and issues into a RegScale security plan, using batchCreateOrUpdate semantics'
- name: OSCAL catalogue and profile management
  detail: '`regscale catalog` + `regscale oscal` download, compare, diagnose and update digitized regulation catalogues'
- name: FedRAMP / eMASS package generation
  detail: '`regscale fedramp` and `regscale emass` produce and exchange authorization-package artifacts'
- name: run as a local REST service
  detail: '`regscale-rest` exposes the CLI over a local Flask API for embedding in pipelines'
configuration:
  file: init.yaml
  key_fields:
  - name: domain
    default: https://regscale.yourcompany.com/
    note: 'the tenant base URL - RegScale''s own shipped default, and the clearest published statement that the API host is customer-specific'
  - name: token
    note: JWT / Service Account PAT
  secrets_backends: [aws-secrets-manager, environment variables]
