note: >-
  No published rate limits. RegScale's documentation index carries no rate-limit, quota or
  throttling page, and its own first-party client (regscale-cli 6.42.0.0) neither reads nor
  logs any RateLimit-* / X-RateLimit-* / Retry-After response header - it manages load with a
  client-side retry policy and circuit breaker instead. This is consistent with the delivery
  model: RegScale runs in the customer's own tenant (SaaS, hybrid or on-premises), so capacity
  is a deployment property rather than a published product limit. Recorded as an honest zero,
  not as unlimited.
