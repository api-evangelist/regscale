generated: '2026-08-26'
method: derived
source: 'grpc/regscale-asset.proto, grpc/regscale-issue.proto, grpc/regscale-vuln.proto + regscale-cli 6.42.0.0 model layer'
note: >-
  Derived from RegScale's own published gRPC message definitions and from the 100+ model
  classes in the first-party regscale-cli distribution. There is no public OpenAPI, so field
  lists are authoritative only for the three entities covered by the gRPC contracts (asset,
  issue, vulnerability); every other entity is recorded by name and REST module slug as
  published by the CLI, without invented fields.
identity:
  primary_key: integer id per module
  natural_keys: 'batch ingestion matches on caller-supplied unique_key_fields; records also carry a uuid'
  parent_link:
    fields: [parentId, parentModule]
    detail: >-
      The universal relationship edge in RegScale. Any record can belong to a record in any
      other module by (parentId, parentModule), which is why the REST surface exposes one
      generic child read - /api/{module}/getAllByParent/{intParentID}/{strModule} - rather than
      per-pair nested routes.
