contract_backed_entities:
- entity: Asset
  proto: grpc/regscale-asset.proto
  message: AssetBase
  field_count: 69
  external_identifier_fields: [aws_identifier, azure_identifier, google_identifier, other_cloud_identifier, qualys_id, sicura_id, tenable_id, wiz_id, emass_id, cpe]
  note: >-
    The external-identifier field set is itself a finding - the asset model is designed to be
    the join point between scanner and cloud inventories, which is what makes the ingestion
    services the highest-volume surface.
- entity: Issue
  proto: grpc/regscale-issue.proto
  message: IssueBase
- entity: Vulnerability
  proto: grpc/regscale-vuln.proto
  message: VulnBase
